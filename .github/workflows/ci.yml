name: GitHub Actions CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest flake8

      - name: Code Quality
        run: |
          python -m flake8 cart.py orders.py || true

      - name: Run Tests
        run: |
          python -m pytest

      - name: Package
        run: |
          python package.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodexpress-package
          path: foodexpress.zip